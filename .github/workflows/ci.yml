name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (OS=${{ matrix.os }}, Python=${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Verify installation
        run: |
          echo "Platform: ${{ matrix.os }}"
          uv run python -c "import pandas; print('[OK] Pandas version:', pandas.__version__)"
          uv run python -c "import numpy; print('[OK] NumPy version:', numpy.__version__)"
          uv run python -c "import click; print('[OK] Click version:', click.__version__)"
          uv run python -c "from ethnicolr import cli; print('[OK] CLI module loads successfully')"

      - name: Verify TensorFlow (non-Windows)
        if: runner.os != 'Windows'
        run: |
          uv run python -c "import tensorflow; print('[OK] TensorFlow version:', tensorflow.__version__)"
          uv run python -c "import tensorflow as tf; print('[OK] TensorFlow functionality:', tf.constant([1, 2, 3]))"

      - name: Windows note
        if: runner.os == 'Windows'
        run: echo "[INFO] TensorFlow skipped on Windows due to missing wheels for tensorflow-io-gcs-filesystem"

      - name: Run test suite
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Running Windows-compatible tests (excluding TensorFlow-dependent tests)"
            uv run pytest tests/test_edge_cases.py -v
          else
            echo "Running full test suite"
            uv run pytest
          fi

  lint:
    name: Lint (Linux, Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --all-extras --dev

      - name: Verify TensorFlow for import checking
        run: uv run python -c "import tensorflow; print('[OK] TensorFlow available for import checking')"

      - name: Run linting
        run: uv run ruff check .
