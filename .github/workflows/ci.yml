name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (OS=${{ matrix.os }}, Python=${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Verify installation
        run: |
          echo "Platform: ${{ matrix.os }}"
          uv run python -c "import tensorflow; print('✓ TensorFlow version:', tensorflow.__version__)"
          uv run python -c "import pandas; print('✓ Pandas version:', pandas.__version__)"
          uv run python -c "import numpy; print('✓ NumPy version:', numpy.__version__)"
          uv run python -c "import click; print('✓ Click version:', click.__version__)"
          uv run python -c "import tensorflow as tf; print('✓ TensorFlow functionality:', tf.constant([1, 2, 3]))"
          uv run python -c "from ethnicolr import cli; print('✓ CLI module loads successfully')"

      - name: Run test suite
        run: uv run pytest

  lint:
    name: Lint (Linux, Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --all-extras --dev

      - name: Verify TensorFlow for import checking
        run: uv run python -c "import tensorflow; print('✓ TensorFlow available for import checking')"

      - name: Run linting
        run: uv run ruff check .
