name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (OS=${{ matrix.os }}, Python=${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package (tests + TF runtime)
        # Install in development mode with all required dependency groups
        run: |
          uv sync --group test --group inference --group dev
          uv pip install --no-deps -e .
          # Fallback: Explicitly install TensorFlow if sync didn't work
          uv run python -c "import tensorflow" || uv pip install "tensorflow>=2.15.0,<3.0.0"

      - name: Verify TensorFlow installation
        run: |
          echo "Verifying core dependencies..."
          uv run python -c "import tensorflow; print('✓ TensorFlow version:', tensorflow.__version__)"
          uv run python -c "import pandas; print('✓ Pandas version:', pandas.__version__)"
          uv run python -c "import numpy; print('✓ NumPy version:', numpy.__version__)"
          echo "Testing TensorFlow functionality..."
          uv run python -c "import tensorflow as tf; print('✓ TensorFlow can create tensors:', tf.constant([1, 2, 3]))"

      - name: Run test suite
        run: uv run pytest

  lint:
    name: Lint (Linux, Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies (incl. TF so imports succeed)
        run: |
          uv sync --group dev --group inference
          uv pip install --no-deps -e .
          # Fallback: Explicitly install TensorFlow if sync didn't work
          uv run python -c "import tensorflow" || uv pip install "tensorflow>=2.15.0,<3.0.0"

      - name: Verify dependencies for linting
        run: |
          uv run python -c "import tensorflow; print('TensorFlow available for import checking')"

      - name: Ruff lint
        run: uv run ruff check .
