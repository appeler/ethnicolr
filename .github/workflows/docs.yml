name: Docs

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: gojiplus/py-canon/.github/workflows/reusable-docs.yml@07c6621880b82afd28ab7230eab6e79f96d080e3 # v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      docs-dir: docs/source
      deploy: ${{ github.event_name == 'push' }}
      run-doctests: false
