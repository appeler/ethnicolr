name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Likely Test'
        required: false
        default: 'Manual build'
jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # required for creating releases
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Sync citation metadata
        uses: recite/citation-sync@v0.3.0
        with:
          commit: true

      - name: Extract version from pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV

      - name: Create git tag for manual triggers
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin "v$RELEASE_VERSION"

      - name: Extract release notes
        run: |
          # Extract release notes for current version from CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            awk '/^## \['"$RELEASE_VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.txt
          fi
          # If no specific version found or no CHANGELOG, use a generic message
          if [ ! -s release_notes.txt ]; then
            echo "Release v$RELEASE_VERSION of ethnicolr" > release_notes.txt
            echo "" >> release_notes.txt
            echo "Automated release from workflow trigger." >> release_notes.txt
            echo "" >> release_notes.txt
            echo "See commit history for detailed changes." >> release_notes.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ethnicolr v${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.TAG_NAME }}
          body_path: release_notes.txt
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
