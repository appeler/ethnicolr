name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Likely Test'
        required: false
        default: 'Manual build'
jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # required for creating releases
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Build package
        run: uv build

      - name: Sync citation metadata
        uses: recite/citation-sync@v0.3.0
        with:
          commit: true

      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Extract release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # Extract release notes for current version from CHANGELOG.md
          awk '/^## \['"$RELEASE_VERSION"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md > release_notes.txt
          # If no specific version found, use a generic message
          if [ ! -s release_notes.txt ]; then
            echo "Release $RELEASE_VERSION of ethnicolr" > release_notes.txt
            echo "" >> release_notes.txt
            echo "See [CHANGELOG.md](https://github.com/appeler/ethnicolr/blob/master/CHANGELOG.md) for detailed changes." >> release_notes.txt
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ethnicolr v${{ env.RELEASE_VERSION }}
          tag_name: ${{ env.TAG_NAME }}
          body_path: release_notes.txt
          files: |
            dist/*.whl
            dist/*.tar.gz
          draft: false
          prerelease: false

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
