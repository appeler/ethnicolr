name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to PyPI when running from a version tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gojiplus/py-canon/.github/workflows/reusable-release.yml@07c6621880b82afd28ab7230eab6e79f96d080e3 # v1
    permissions:
      contents: write
      id-token: write
    with:
      github-release: ${{ github.event_name == 'push' }}

  publish:
    needs: release
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          skip-existing: true
