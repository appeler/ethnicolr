name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Install test dependencies from pyproject.toml
        run: |
          pip install .[test]

          # Add TensorFlow depending on platform
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            pip install tensorflow-macos==2.13.0 keras==2.13.1
          else
            pip install "tensorflow>=2.13,<2.14"
          fi

      - name: Verify pyproject.toml (build sdist/wheel)
        run: python -m build --sdist --wheel --outdir dist/

      - name: Run tests
        run: pytest
