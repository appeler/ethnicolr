name: test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Install dependencies
        run: |
          uv pip install --system ruff mypy
      
      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .
      
      - name: Run mypy
        run: mypy ethnicolr --ignore-missing-imports
        continue-on-error: true

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[test]"
          
          # Add TensorFlow depending on platform
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            uv pip install --system tensorflow-macos==2.13.0 keras==2.13.1
          else
            uv pip install --system "tensorflow>=2.13,<2.14"
          fi

      - name: Build package
        run: uv build

      - name: Run tests
        run: pytest ethnicolr/tests/ -v --cov=ethnicolr
