name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync --group dev
      
      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      
      - name: Run mypy
        run: uv run mypy ethnicolr --ignore-missing-imports
        continue-on-error: true

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --group test
          
          # Add TensorFlow depending on platform
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            uv add tensorflow-macos keras
          else
            uv add tensorflow
          fi

      - name: Build package
        run: uv build

      - name: Run tests
        run: uv run pytest ethnicolr/tests/ -v --cov=ethnicolr
