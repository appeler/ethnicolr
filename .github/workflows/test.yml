name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync --group dev
      
      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      
      - name: Run mypy
        run: uv run mypy ethnicolr --ignore-missing-imports
        continue-on-error: true

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Install TensorFlow dependencies
        shell: bash
        run: |
          # Add TensorFlow with tested working versions based on OS
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            uv sync --group macos
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            uv sync --group windows
          else
            uv sync --group linux
          fi

      - name: Build package
        run: uv build

      - name: Run tests
        run: uv run pytest ethnicolr/tests/ -v --cov=ethnicolr
