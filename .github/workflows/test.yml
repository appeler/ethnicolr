name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  tests:
    name: Tests (OS=${{ matrix.os }}, Python=${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package (tests + TF runtime)
        # Extras come from [project.optional-dependencies] in pyproject.toml
        run: python -m pip install ".[test,inference]"

      - name: Run test suite
        run: pytest

  lint:
    name: Lint & type-check (Linux, Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dev dependencies (incl. TF so imports succeed)
        run: python -m pip install ".[dev,inference]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy type-check
        run: mypy ethnicolr
