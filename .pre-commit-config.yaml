repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Vocab CSVs contain n-grams with meaningful trailing spaces
        exclude: '^ethnicolr/models/.*_vocab.*\.csv$'
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500', '--enforce-all']
        exclude: >-
          (?x)^(
            ethnicolr/data/(census|rosenman)/.*\.parquet |
            ethnicolr/data/census/census_.*\.csv |
            ethnicolr/data/rosenman/.*\.csv\.gz |
            ethnicolr/data/wiki/wiki_name_race\.csv |
            scripts/data-acquisition/.*\.(xlsx|pdf|tar\.gz) |
            ethnicolr/models/.*\.pt
          )$
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
