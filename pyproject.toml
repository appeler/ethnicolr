[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "ethnicolr"
version = "2.0.0"
description = "Name-pattern estimates with calibrated probabilities and explicit abstention"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Gaurav Sood", email = "contact@gsood.com" },
  { name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com" },
]

keywords = [
  "race",
  "ethnicity",
  "names",
  "demographics",
  "machine-learning",
  "nlp",
]

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "click>=8.0.0",
  "huggingface_hub>=1.27.0",
  "pyarrow>=25.0.0",
  "torch>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/appeler/ethnicolr"
"Bug Reports" = "https://github.com/appeler/ethnicolr/issues"
"Documentation" = "https://appeler.github.io/ethnicolr/"
"Source Code" = "https://github.com/appeler/ethnicolr"

[project.scripts]
ethnicolr = "ethnicolr.cli:cli"

[dependency-groups]
docs = [
  "sphinx>=7.0",
  "furo>=2024.1.29",
  "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
  "sphinx-autodoc-typehints>=1.25",
  "sphinx-copybutton>=0.5",
  "myst-parser>=2.0",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.0",
  "ruff>=0.7.0",
  "pre-commit>=3.0",
  "pyright>=1.1.411",
  "pydoclint>=0.5",
]
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.0",
  "scikit-learn>=1.4",
]
training = [
  "scikit-learn>=1.4",
  "openpyxl>=3.1",
  "pyreadr>=0.5",
]

[tool.uv]

[tool.uv.build-backend]
module-root = ""
source-exclude = [
  "/ethnicolr/.DS_Store",
  "/ethnicolr/.pytype",
  "/ethnicolr/data/**/.DS_Store",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  ".git",
  "__pycache__",
  "build",
  "dist",
  ".venv",
  "docs",
  ".eggs",
  "*.ipynb",
  "ethnicolr/models/*.ipynb",
]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# S603: the CLI tests exercise the installed console script through subprocess;
# that is the point of those tests, not an injection risk.
"tests/**" = ["S101", "D", "ARG", "SLF", "S603"]
# These docstrings are click help text, not Sphinx prose. D301: click's
# no-rewrap marker is a real backspace escape (\b); a raw docstring would turn
# it into literal text and break the help formatting. D412: the marker only
# works as its own paragraph, which needs the blank line D412 forbids.
"ethnicolr/cli.py" = ["D301", "D412"]
"docs/**" = ["D"]
"__init__.py" = ["F401"]
# Research and data-acquisition scripts, excluded from the wheel. print is
# their output channel (T20), shebang permissions do not survive checkout
# (EXE), subprocess/urlopen against fixed government and Wikidata endpoints is
# their job (S), and X/X_train/functional-as-F follow sklearn and torch
# convention (N806, N812). Docstring rules stay off one-off helpers (D).
"scripts/**" = ["T20", "D", "S", "EXE", "N806", "N812"]
"*.ipynb" = ["E402", "E722", "UP031", "B905", "F821", "F811", "W293", "F841", "E501", "F401", "E302", "E305", "W391"]
"docs/examples/*.ipynb" = ["E402", "E722", "UP031", "B905", "F821", "F811", "W293", "F841", "E501", "F401", "E302", "E305", "W391"]

[tool.ruff.lint.isort]
known-first-party = ["ethnicolr"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = [
  "-ra",
  "--strict-markers",
  "--cov=ethnicolr",
  # term-missing only: nothing in CI uploads or reads a coverage file, so the
  # html and xml reports were writing htmlcov/ and coverage.xml into the tree
  # on every run for no reader. Ask for them explicitly when you want them.
  "--cov-report=term-missing",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]


[tool.coverage.run]
source = ["ethnicolr"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.deptry]
# Exclude development/research code that uses transitive dependencies
extend_exclude = [
  "scripts/",
  "examples/",
]

# Ignore notebooks
ignore_notebooks = true

# These are legitimate dependencies used as CLI tools, not imports
known_first_party = ["ethnicolr"]

# Tell deptry these are dev dependency groups (won't be flagged as unused)
pep621_dev_dependency_groups = ["test", "dev", "docs"]

[tool.pyright]
# Type-check the shipped package. Data acquisition and model training have
# separate runtime dependencies and validation commands.
include = ["ethnicolr"]
typeCheckingMode = "standard"

[tool.codespell]
# The census and wiki tables are names, not prose. codespell reported 12,249
# findings across this repo and every one was in the corpora or the model
# files -- there are no misspellings in the source. Auto-"correcting" a name
# would also silently corrupt the data these models are trained on.
skip = "*.csv,*.csv.gz,*.parquet,*.joblib,*.h5,*.keras,./ethnicolr/data,./ethnicolr/models,./scripts/data-acquisition/source-tables,uv.lock"

[tool.preen]
# API bases and RDF namespace URIs that are alive but answer 404 to the bare
# GET the links check sends.
link_ignore = [
  "https://dataverse\\.harvard\\.edu/api/access/datafile",
  "http://www\\.wikidata\\.org/prop/direct/",
  "https://qlever\\.dev/api/wikidata",
]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
# cli.py docstrings are click help text rendered to end users, not API
# reference; documenting every click-injected parameter there would bloat
# --help output.
exclude = '\.venv|tests|docs|ethnicolr/cli\.py'
