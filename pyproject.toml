[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[project]
name = "ethnicolr"
version = "0.19.0"
description = "Predict Race/Ethnicity Based on Sequence of Characters in Names"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    
    {name = "Gaurav Sood", email = "contact@gsood.com"},
    {name = "Suriyan Laohaprapanon", email = "suriyant@gmail.com"}
]
keywords = ["race", "ethnicity", "names", "demographics", "machine-learning", "nlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0,<3.0.0"
]

[project.urls]
"Homepage" = "https://github.com/appeler/ethnicolr"
"Bug Reports" = "https://github.com/appeler/ethnicolr/issues"
"Documentation" = "https://appeler.github.io/ethnicolr/"
"Source Code" = "https://github.com/appeler/ethnicolr"

[project.scripts]
census_ln = "ethnicolr.census_ln:main"
pred_census_ln = "ethnicolr.pred_census_ln:main"
pred_wiki_name = "ethnicolr.pred_wiki_name:main"
pred_wiki_ln = "ethnicolr.pred_wiki_ln:main"
pred_fl_reg_name = "ethnicolr.pred_fl_reg_name:main"
pred_fl_reg_ln = "ethnicolr.pred_fl_reg_ln:main"
pred_fl_reg_ln_five_cat = "ethnicolr.pred_fl_reg_ln_five_cat:main"
pred_fl_reg_name_five_cat = "ethnicolr.pred_fl_reg_name_five_cat:main"
pred_nc_reg_name = "ethnicolr.pred_nc_reg_name:main"
ethnicolr_download_models = "ethnicolr.utils.download:main"

[project.optional-dependencies]
# Tested working combinations for ML functionality (Python 3.11 only)
inference = [
  "tensorflow>=2.16.2,<=2.17.0",  # Tested working versions
  "typing-extensions==4.4.0",     # Required for TensorFlow compatibility
  "keras>=3.12.0"                 # Compatible with TensorFlow versions above
]
# Platform-specific inference groups (alias for convenience)
macos = [
  "tensorflow>=2.16.2,<=2.17.0", 
  "typing-extensions==4.4.0",
  "keras>=3.12.0"
]
linux = [
  "tensorflow>=2.16.2,<=2.17.0",
  "typing-extensions==4.4.0", 
  "keras>=3.12.0"
]
windows = [
  "tensorflow>=2.16.2,<=2.17.0",
  "typing-extensions==4.4.0", 
  "keras>=3.12.0"
]
base = ["pandas", "numpy"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.7.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
]


[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "ruff>=0.7.0",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0", 
    "pytest-xdist>=3.0",
    # Include TensorFlow for tests since all test modules import it
    "tensorflow>=2.16.2,<=2.17.0",
    "typing-extensions==4.4.0",
    "keras>=3.12.0"
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.29",
    "sphinx-autodoc-typehints>=1.25",
    "sphinx-copybutton>=0.5",
    "myst-parser>=2.0",
]
# Tested working ML dependencies
inference = [
    "tensorflow>=2.16.2,<=2.17.0",
    "typing-extensions==4.4.0", 
    "keras>=3.12.0"
]
# Platform-specific ML dependencies (for CI)
linux = [
    "tensorflow>=2.16.2,<=2.17.0",
    "typing-extensions==4.4.0", 
    "keras>=3.12.0"
]
macos = [
    "tensorflow>=2.16.2,<=2.17.0", 
    "typing-extensions==4.4.0",
    "keras>=3.12.0"
]
windows = [
    "tensorflow>=2.16.2,<=2.17.0",
    "typing-extensions==4.4.0", 
    "keras>=3.12.0"
]


# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "docs",
    ".eggs",
    "*.ipynb",
    "ethnicolr/models/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imported but unused
"tests/*" = ["S101"]  # use of assert
"*.ipynb" = ["E402", "E722", "UP031", "B905", "F821", "F811", "W293", "F841"]  # ignore notebook linting issues

[tool.ruff.lint.isort]
known-first-party = ["ethnicolr"]


[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["ethnicolr/tests"]
python_files = "test_*.py"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=ethnicolr",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# Coverage configuration
[tool.coverage.run]
source = ["ethnicolr"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
