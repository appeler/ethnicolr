[project.optional-dependencies]
# Core install stays light
base = [
  "pandas",
  "numpy",
]

# Inference only: TF + a pinned typing-extensions that works with 2.15.x
# (TF itself will pull in tensorflow-io-gcs-filesystem where needed.)
inference = [
  "tensorflow>=2.15.0,<2.16.0",
  "typing-extensions>=4.4,<5.0",
]

# If you still want tests / dev tooling, they can be separate extras
test = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.0",
]

dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.0",
  "ruff>=0.7.0",
  "mypy>=1.0",
  "pre-commit>=3.0",
]
